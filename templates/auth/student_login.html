{% extends 'base.html' %}

{% block title %}Student Login - SIMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card">
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Student Login</h3>
                <p class="text-muted">Log in to manage your internship applications</p>
            </div>
            
            <form action="{{ url_for('auth.student_login') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@university.edu">
                    <div class="invalid-feedback">Please enter your email address.</div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">Log In</button>
            </form>
            
            <div class="text-center mt-4">
                <span class="text-muted">Don't have an account? <a href="{{ url_for('auth.student_register') }}" class="text-decoration-none">Register here</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
