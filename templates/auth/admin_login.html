{% extends 'base.html' %}

{% block title %}Admin Login - SIMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-danger" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Admin Portal</h3>
                <p class="text-muted">Enter administrative credentials</p>
            </div>
            
            <div class="alert alert-info py-2" role="alert">
                <small><i class="bi bi-info-circle-fill me-1"></i> Seeding default admin for testing: <br>
                <strong>Email:</strong> admin@sims.com <br>
                <strong>Password:</strong> admin123</small>
            </div>
            
            <form action="{{ url_for('auth.admin_login') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Administrator Email</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="admin@sims.com">
                    <div class="invalid-feedback">Please enter your email address.</div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
                
                <button type="submit" class="btn btn-danger w-100 py-2">Log In as Admin</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
